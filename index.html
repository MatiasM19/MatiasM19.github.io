<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi portafolio</title>
<meta name="description" content="Portafolio personal: perfil, intereses, proyectos y habilidades.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1e1b4b;--violet:#7c5cff;--pink:#ff7ab6;--sand:#fff8ee;--card:#fff;--muted:#5b5780;--line:#e7e1f5}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--sand);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65;overflow-x:hidden}
a{color:var(--violet)}
a:focus-visible,button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.c{max-width:1080px;margin:0 auto;padding:0 24px}

/* Menú */
header{position:fixed;inset:0 0 auto 0;z-index:10;backdrop-filter:blur(12px);background:rgba(30,27,75,.82)}
header .c{display:flex;justify-content:space-between;align-items:center;height:64px}
header b{color:#fff;font-weight:800}
header nav a{color:#d9d3ff;text-decoration:none;margin-left:22px;font-size:.92rem;font-weight:600;transition:color .2s}
header nav a:hover{color:var(--pink)}

/* Portada */
.hero{background:radial-gradient(circle at 80% 20%,#3b2f9e 0,var(--ink) 55%);color:#fff;padding:140px 0 110px;position:relative;overflow:hidden}
.hero .c{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center}
.hola{color:var(--pink);font-weight:600;margin:0 0 8px}
.hero h1{font-size:clamp(2.6rem,6vw,4.6rem);line-height:1.02;margin:0 0 18px;font-weight:800}
.rol{font-size:1.35rem;min-height:2em;color:#d9d3ff;margin:0 0 28px}
.cursor{display:inline-block;width:2px;height:1.1em;background:var(--pink);margin-left:3px;vertical-align:-3px;animation:blink 1s steps(2) infinite}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{padding:12px 24px;border-radius:99px;font-weight:600;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn.p{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff}
.btn.s{border:2px solid #8f84e6;color:#fff}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(124,92,255,.45)}
.hero .txt>*{animation:up .8s both}
.hero .txt>*:nth-child(2){animation-delay:.12s}.hero .txt>*:nth-child(3){animation-delay:.24s}.hero .txt>*:nth-child(4){animation-delay:.36s}

/* ✏️ Foto: marco con anillo animado */
.foto{position:relative;width:min(340px,80%);aspect-ratio:1;margin:0 auto;animation:up 1s .3s both}
.foto::before{content:"";position:absolute;inset:-12px;border-radius:50%;background:conic-gradient(from 0deg,var(--violet),var(--pink),#ffd166,var(--violet));animation:spin 8s linear infinite}
.foto::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--ink)}
.foto img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;z-index:2;background:#3b2f9e}
.orb{position:absolute;border-radius:50%;filter:blur(2px);animation:float 7s ease-in-out infinite}
.o1{width:90px;height:90px;background:var(--pink);opacity:.35;left:4%;bottom:10%}
.o2{width:140px;height:140px;background:var(--violet);opacity:.4;right:46%;top:12%;animation-delay:-3s}

/* Secciones */
section{padding:90px 0}
section.alt{background:#fff}
h2{font-size:clamp(1.8rem,4vw,2.5rem);margin:0 0 36px;font-weight:800}
h2::after{content:"";display:block;width:64px;height:5px;border-radius:9px;margin-top:10px;background:linear-gradient(90deg,var(--violet),var(--pink))}
.sobre{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:start}
.bio{font-size:1.15rem;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--ink);color:#fff;border-radius:16px;padding:18px 8px;text-align:center}
.stat b{display:block;font-size:2rem;color:var(--pink)}
.stat span{font-size:.8rem;color:#d9d3ff}
.chips{display:flex;flex-wrap:wrap;gap:12px;padding:0;list-style:none;margin:0}
.chips li{background:var(--card);border:2px solid var(--line);padding:10px 20px;border-radius:99px;font-weight:600;transition:transform .25s,border-color .25s,background .25s;cursor:default}
.chips li:hover{transform:translateY(-6px) rotate(-2deg);border-color:var(--violet);background:#f3efff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s}
.card::before{content:"";position:absolute;left:0;top:0;height:5px;width:100%;background:linear-gradient(90deg,var(--violet),var(--pink));transform:scaleX(0);transform-origin:left;transition:transform .35s}
.card:hover{transform:translateY(-8px);box-shadow:0 18px 40px rgba(30,27,75,.14)}
.card:hover::before{transform:scaleX(1)}
.card h3{margin:0 0 8px;font-size:1.15rem}
.card p{margin:0 0 14px;color:var(--muted);font-size:.95rem}
.meta{font-size:.82rem;color:var(--muted);margin-bottom:10px}
.bar{margin-bottom:20px}
.bar .top{display:flex;justify-content:space-between;font-weight:600}
.track{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--pink));transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.tl{border-left:3px solid var(--line);padding-left:28px;margin-left:8px}
.tl article{position:relative;margin-bottom:26px}
.tl article::before{content:"";position:absolute;left:-38px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 5px #fff,0 0 0 8px var(--line)}
.tl h3{margin:0}.tl p{margin:0;color:var(--muted)}
.contacto{background:var(--ink);color:#fff;text-align:center}
.contacto h2::after{margin-inline:auto}
.contacto p{max-width:52ch;margin:0 auto 28px;color:#d9d3ff;font-size:1.1rem}
footer{background:var(--ink);color:#8f88c9;text-align:center;padding:0 0 28px;font-size:.88rem}

/* Aparición al hacer scroll */
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}

@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-26px)}}
@keyframes blink{50%{opacity:0}}
@media (max-width:820px){
  .hero .c,.sobre{grid-template-columns:1fr}
  .hero{padding-top:110px;text-align:center}.btns{justify-content:center}
  .foto{order:-1;width:min(240px,70%)}
  header nav a:not(:last-child){display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<header><div class="c"><b id="logo"></b>
  <nav><a href="#sobre-mi">Sobre mí</a><a href="#proyectos">Proyectos</a><a href="#habilidades">Habilidades</a><a href="#trayectoria">Trayectoria</a><a href="#contacto">Contacto</a></nav></div></header>

<div class="hero">
  <span class="orb o1"></span><span class="orb o2"></span>
  <div class="c">
    <div class="txt">
      <p class="hola">Hola, soy</p>
      <h1 id="nombre"></h1>
      <p class="rol"><span id="rol"></span><span class="cursor"></span></p>
      <div class="btns"><a class="btn p" href="#proyectos">Ver mis proyectos</a><a class="btn s" id="btn-gh" target="_blank" rel="noopener">Mi GitHub</a></div>
    </div>
    <div class="foto"><img id="foto" alt="Mi foto"></div>
  </div>
</div>

<section id="sobre-mi"><div class="c sobre">
  <div class="rv"><h2>Sobre mí</h2><p class="bio" id="bio"></p></div>
  <div class="rv"><h2>GitHub</h2><div class="stats">
    <div class="stat"><b data-n id="s-repos">–</b><span>repositorios</span></div>
    <div class="stat"><b data-n id="s-fol">–</b><span>seguidores</span></div>
    <div class="stat"><b data-n id="s-sig">–</b><span>siguiendo</span></div></div>
    <p class="meta" id="s-desde" style="margin-top:14px"></p></div>
</div></section>

<section class="alt" id="intereses"><div class="c rv"><h2>Intereses</h2><ul class="chips" id="intereses-lista"></ul></div></section>

<section id="proyectos"><div class="c"><h2 class="rv">Proyectos</h2><div class="grid" id="proyectos-lista"></div>
  <h2 class="rv" style="margin-top:70px">Últimos repositorios</h2>
  <p id="gh-estado" class="meta">Cargando desde GitHub…</p><div class="grid" id="gh-lista"></div></div></section>

<section class="alt" id="habilidades"><div class="c"><h2 class="rv">Habilidades</h2><div id="habilidades-lista" style="max-width:720px"></div></div></section>

<section id="trayectoria"><div class="c"><h2 class="rv">Trayectoria</h2><div class="tl" id="trayectoria-lista"></div></div></section>

<section class="contacto" id="contacto"><div class="c rv"><h2>Contacto</h2><p id="contacto-texto"></p><div class="btns" style="justify-content:center" id="enlaces"></div></div></section>
<footer id="pie"></footer>

<script>
/* =====================================================================
   ✏️ EDITA AQUÍ: TODA TU INFORMACIÓN ESTÁ EN ESTE BLOQUE
   Cambia solo el texto entre comillas. No borres comas ni llaves.
   ===================================================================== */
const PERFIL = {
  usuarioGithub: "MatiasM19",              // ✏️ Tu usuario de GitHub (de aquí salen estadísticas y repos)
  nombre: "Matías Morillo Alejandro Tenorio",             // ✏️
  roles: ["Estudiante de Ingeniería en Computación", "Apasionado por la tecnología", "Desarrollador de Programas"], // ✏️ Se escriben con efecto de máquina
  bio: "Estudio Ingenieria de la Computación en la Universidad Escuela Politécnica Nacional (EPN), me apasiona los juegos en linea, en un futuro deseo diseñar un juego en linea que cumpla con las expectativas de la juventud actual", // ✏️

  // ✏️ TU FOTO: sube una imagen a tu repositorio (junto a index.html) con este nombre exacto.
  //    Si el archivo no existe, se muestra tu foto de GitHub automáticamente.
  foto: "foto.jpeg",

  enlaces: [  // ✏️ Botones de la sección Contacto (borra los que no uses)
    { texto: "GitHub",   url: "https://github.com/MatiasM19" },
    { texto: "Correo",   url: "matias.morillo@epn.edu.ec" }
  ],

  intereses: ["Inteligencia artificial", "Videojuegos", "Música"], // ✏️

  habilidades: [ // ✏️ Nivel de 0 a 100
    { nombre: "Python", nivel: 50 },
    { nombre: "Git y GitHub", nivel: 50 },
    { nombre: "Inglés", nivel: 98 },
    { nombre: "SQL", nivel: 55 }
  ],

  trayectoria: [ // ✏️ Educación, cursos, experiencia, logros
    { titulo: "Bachiller en Ciencias", lugar: "UEM Calderón", periodo: "2018" },
    { titulo: "Suficiencia en Inglés (B1)", lugar: "Centro de Idiomas EPN", periodo: "2024" }
  ],

  contacto: "¿Quieres colaborar o conversar? Escríbeme y con gusto te respondo.", // ✏️
  maxReposGithub: 6   // ✏️ Cuántos repositorios mostrar automáticamente
};
/* ======================= FIN DE LA PARTE EDITABLE ======================= */

const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
const link = (txt, url, cls) => { const a = el("a", cls || "", txt); a.href = url; a.target = "_blank"; a.rel = "noopener"; return a; };
const U = PERFIL.usuarioGithub;

document.title = PERFIL.nombre;
$("logo").textContent = PERFIL.nombre.split(" ")[0];
$("nombre").textContent = PERFIL.nombre;
$("bio").textContent = PERFIL.bio;
$("contacto-texto").textContent = PERFIL.contacto;
$("btn-gh").href = "https://github.com/" + U;
$("pie").textContent = `© ${new Date().getFullYear()} ${PERFIL.nombre}`;
$("foto").src = PERFIL.foto;
$("foto").onerror = function () { this.onerror = null; this.src = `https://github.com/${U}.png?size=400`; };

PERFIL.enlaces.forEach((l, i) => $("enlaces").append(link(l.texto, l.url, "btn " + (i ? "s" : "p"))));
PERFIL.intereses.forEach(i => $("intereses-lista").append(el("li", "", i)));

PERFIL.proyectos.forEach(p => {
  const c = el("div", "card rv"); c.append(el("h3", "", p.titulo), el("p", "", p.descripcion), el("div", "meta", p.tecnologias));
  if (p.url) c.append(link("Ver proyecto", p.url)); $("proyectos-lista").append(c);
});
PERFIL.habilidades.forEach(h => {
  const b = el("div", "bar rv"), t = el("div", "top"), tr = el("div", "track"), f = el("div", "fill");
  f.dataset.w = h.nivel; t.append(el("span", "", h.nombre), el("span", "", h.nivel + "%")); tr.append(f); b.append(t, tr); $("habilidades-lista").append(b);
});
PERFIL.trayectoria.forEach(t => {
  const a = el("article", "rv"); a.append(el("h3", "", t.titulo), el("p", "", `${t.lugar} · ${t.periodo}`)); $("trayectoria-lista").append(a);
});

/* Efecto de escritura en el rol */
(function () {
  const r = PERFIL.roles, out = $("rol"); let i = 0, j = 0, borrando = false;
  (function tick() {
    const s = r[i]; out.textContent = s.slice(0, j);
    if (!borrando && j === s.length) { borrando = true; return setTimeout(tick, 1600); }
    if (borrando && j === 0) { borrando = false; i = (i + 1) % r.length; }
    j += borrando ? -1 : 1; setTimeout(tick, borrando ? 35 : 75);
  })();
})();

/* Animaciones al hacer scroll */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return; e.target.classList.add("in");
  e.target.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%"); io.unobserve(e.target);
}), { threshold: .15 });
document.querySelectorAll(".rv").forEach(n => io.observe(n));

/* Contador animado */
function contar(id, n) {
  const e = $(id), t0 = performance.now();
  (function paso(t) { const p = Math.min((t - t0) / 1200, 1); e.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(paso); })(t0);
}

/* Datos reales y actualizados desde GitHub */
fetch(`https://api.github.com/users/${U}`).then(r => r.ok ? r.json() : Promise.reject()).then(u => {
  contar("s-repos", u.public_repos); contar("s-fol", u.followers); contar("s-sig", u.following);
  $("s-desde").textContent = "En GitHub desde " + new Date(u.created_at).getFullYear();
}).catch(() => {});

fetch(`https://api.github.com/users/${U}/repos?sort=updated&per_page=30`).then(r => r.ok ? r.json() : Promise.reject()).then(repos => {
  const lista = repos.filter(r => !r.fork).slice(0, PERFIL.maxReposGithub);
  if (!lista.length) { $("gh-estado").textContent = "Aún no hay repositorios públicos para mostrar."; return; }
  $("gh-estado").remove();
  lista.forEach(r => {
    const c = el("div", "card rv in"), h = el("h3"); h.append(link(r.name, r.html_url));
    c.append(h, el("p", "", r.description || "Sin descripción."),
      el("div", "meta", `${r.language || "—"} · ★ ${r.stargazers_count} · Actualizado ${new Date(r.pushed_at).toLocaleDateString("es-EC")}`));
    $("gh-lista").append(c);
  });
}).catch(() => { $("gh-estado").textContent = "No se pudieron cargar los repositorios. Revisa que 'usuarioGithub' esté bien escrito."; });
</script>
</body>
</html>
